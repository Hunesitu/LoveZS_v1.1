<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveZS UI 设计方案预览</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .preview-container {
      height: calc(100vh - 180px);
    }
    .tab-active {
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      color: white;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-6 py-4">
      <h1 class="text-2xl font-bold text-gray-800 mb-2">💖 LoveZS UI 设计方案</h1>
      <p class="text-gray-500 text-sm">选择你喜欢的主题方案，点击下方按钮切换预览</p>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-5">
    <!-- 切换按钮 -->
    <div class="flex gap-3 mb-5">
      <button onclick="switchTheme(1)" id="btn-1" class="tab-active px-5 py-2.5 rounded-xl font-medium text-sm transition-all shadow-md">
        ✨ 方案一：梦幻星辰
      </button>
      <button onclick="switchTheme(2)" id="btn-2" class="bg-white px-5 py-2.5 rounded-xl font-medium text-sm text-gray-600 hover:bg-gray-100 transition-all shadow-sm">
        🌹 方案二：优雅玫瑰
      </button>
      <button onclick="switchTheme(3)" id="btn-3" class="bg-white px-5 py-2.5 rounded-xl font-medium text-sm text-gray-600 hover:bg-gray-100 transition-all shadow-sm">
        🌿 方案三：春日花园
      </button>
    </div>

    <!-- 方案说明 -->
    <div id="desc-1" class="bg-pink-50 border border-pink-100 rounded-xl p-4 mb-5">
      <h3 class="font-semibold text-pink-700 mb-1">✨ 梦幻星辰 · Dreamy Theme</h3>
      <p class="text-sm text-pink-600">粉紫渐变 + 玻璃拟态 + 微光闪烁 + 星星浮动动画 · 浪漫少女感</p>
    </div>
    <div id="desc-2" class="bg-rose-50 border border-rose-100 rounded-xl p-4 mb-5 hidden">
      <h3 class="font-semibold text-rose-700 mb-1">🌹 优雅玫瑰 · Elegant Rose Theme</h3>
      <p class="text-sm text-rose-600">灰玫瑰色调 + 纸张纹理 + 金色点缀 + 衬线字体 · 高级克制复古</p>
    </div>
    <div id="desc-3" class="bg-green-50 border border-green-100 rounded-xl p-4 mb-5 hidden">
      <h3 class="font-semibold text-green-700 mb-1">🌿 春日花园 · Spring Garden Theme</h3>
      <p class="text-sm text-green-600">鼠尾草绿 + 蜜桃橙 + 有机形状 + 浮动叶子 · 清新治愈舒适</p>
    </div>

    <!-- 预览 iframe -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
      <iframe id="preview-frame" src="theme1-dreamy.html" class="w-full preview-container" frameborder="0"></iframe>
    </div>

    <!-- 底部提示 -->
    <div class="mt-5 text-center text-sm text-gray-500">
      <p>💡 预览后，请告诉我你最喜欢哪个方案，我会将其应用到整个项目中</p>
    </div>
  </div>

  <script>
    function switchTheme(themeId) {
      // 更新按钮状态
      for (let i = 1; i <= 3; i++) {
        const btn = document.getElementById('btn-' + i);
        const desc = document.getElementById('desc-' + i);
        if (i === themeId) {
          btn.className = 'tab-active px-5 py-2.5 rounded-xl font-medium text-sm transition-all shadow-md';
          desc.classList.remove('hidden');
        } else {
          btn.className = 'bg-white px-5 py-2.5 rounded-xl font-medium text-sm text-gray-600 hover:bg-gray-100 transition-all shadow-sm';
          desc.classList.add('hidden');
        }
      }

      // 更新 iframe
      const frame = document.getElementById('preview-frame');
      const files = {
        1: 'theme1-dreamy.html',
        2: 'theme2-elegant-rose.html',
        3: 'theme3-spring-garden.html'
      };
      frame.src = files[themeId];
    }
  </script>
</body>
</html>
